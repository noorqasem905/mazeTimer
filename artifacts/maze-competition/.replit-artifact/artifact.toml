kind = "web"
previewPath = "/"
title = "ASU Maze Competition"
version = "1.0.0"
id = "artifacts/maze-competition"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20156

[services.development]
run = "pnpm --filter @workspace/maze-competition run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maze-competition", "run", "build" ]
publicDir = "artifacts/maze-competition/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20156"
BASE_PATH = "/"
